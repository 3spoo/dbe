<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="DBE - modellatore visuale di database">
<title>DBE · ER Modeler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head><body>
<aside class="app-sidebar">
  <div class="brand-lockup"><img src="assets/dbe-logo.svg" alt="DBE"><div><strong>DBE</strong><small>ER modeler</small></div></div>
  <div><label for="pn">Nome database</label><input id="pn" class="form-control" type="text"></div>
  <div class="toolbar-actions"><button id="be" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Entità</button><button id="br" class="btn btn-primary"><i class="bi bi-diagram-3"></i> Relazione</button></div>
  <div class="workspace-note"><i class="bi bi-mouse2"></i><span>Trascina un punto di collegamento della relazione sopra un'entità per cambiare il collegamento.</span></div>
  <h2>Elementi</h2><div id="list"></div>
  <h2>Esporta</h2>
  <div class="toolbar-actions"><button id="bp" class="btn btn-outline-secondary"><i class="bi bi-filetype-png"></i> PNG</button><button id="bf" class="btn btn-outline-secondary"><i class="bi bi-filetype-pdf"></i> PDF</button><button id="bj" class="btn btn-outline-secondary"><i class="bi bi-filetype-json"></i> JSON</button></div>
  <div class="toolbar-actions"><button id="bl" class="btn btn-outline-secondary flex-fill"><i class="bi bi-folder2-open"></i> Apri</button><button id="bn" class="btn btn-outline-secondary flex-fill"><i class="bi bi-file-earmark-plus"></i> Nuovo</button></div>
  <input id="fi" type="file" accept=".json,application/json" hidden>
  <div class="sidebar-footer"><span>Offline-ready</span><a href="https://github.com/3spoo/dbe" target="_blank" rel="noreferrer">github.com/3spoo/dbe</a></div>
</aside>
<main><svg id="sv" aria-label="Canvas del diagramma"><g id="g"></g></svg><div id="hint">Nessuna entità<br><small>Usa <b>+ Entità</b> per iniziare</small></div>
<div class="zc"><button id="zo" aria-label="Riduci zoom"><i class="bi bi-dash"></i></button><span id="zl">100%</span><button id="zi" aria-label="Aumenta zoom"><i class="bi bi-plus"></i></button><button id="zf" aria-label="Adatta al canvas"><i class="bi bi-arrows-fullscreen"></i></button></div></main>
<div id="ov" class="ovl" hidden></div><div id="ov2" class="ovl" hidden></div><div id="cm" hidden></div><div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/app.js"></script>
</body></html>
